<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Hospital Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F7;
  --surface:#FFFFFF;
  --surface-2:#EEF3F1;
  --teal:#0E6F5C;
  --teal-dark:#095045;
  --navy:#16324F;
  --text:#1C2B27;
  --text-muted:#64756F;
  --border:#DEE6E2;
  --danger:#C0392B;
  --danger-light:#FBE8E6;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,40,35,0.04);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--navy);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
h2{font-family:'Fraunces',serif;font-weight:600;margin:0;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;font-size:14px;}

.login-card{background:var(--surface);border-radius:16px;padding:34px 32px;width:380px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.brand-mark{width:46px;height:46px;border-radius:12px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin-bottom:16px;}
.login-card h2{font-size:20px;margin-bottom:4px;}
.sub{font-size:12.5px;color:var(--text-muted);margin-bottom:22px;}
.role-toggle{display:flex;gap:8px;margin-bottom:16px;background:var(--surface-2);padding:4px;border-radius:10px;}
.role-toggle button{flex:1;border:none;background:none;padding:9px 0;border-radius:7px;font-size:13px;font-weight:500;color:var(--text-muted);}
.role-toggle button.active{background:var(--surface);color:var(--teal-dark);box-shadow:var(--shadow);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;}
.field input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);}
.login-error{background:var(--danger-light);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:none;}
.login-error.show{display:block;}
.btn-primary{width:100%;padding:11px 0;margin-top:4px;background:var(--teal);border:1px solid var(--teal);color:#fff;border-radius:8px;font-size:13.5px;font-weight:500;}
.btn-primary:hover{background:var(--teal-dark);}
.login-hint{font-size:11.5px;color:var(--text-muted);margin-top:14px;text-align:center;}
.mono{font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-mark">SC</div>
  <h2>SehatConnectAI Hospital</h2>
  <p class="sub">Sign in to the hospital module</p>

  <div class="role-toggle">
    <button type="button" class="active" data-role="admin" onclick="selectRole('admin')">Admin</button>
    <button type="button" data-role="staff" onclick="selectRole('staff')">Staff</button>
  </div>

  <div class="login-error" id="loginError">Invalid username or password.</div>

  <div class="field"><label>Username</label><input id="login_user" placeholder="e.g. admin" autocomplete="username"></div>
  <div class="field"><label>Password</label><input id="login_pass" type="password" placeholder="Enter password" autocomplete="current-password"></div>

  <button class="btn-primary" onclick="attemptLogin()">Sign in as <span id="loginRoleLabel">Admin</span></button>

  <p class="login-hint">Demo credentials — Admin: <span class="mono">admin / admin123</span> · Staff: <span class="mono">staff / staff123</span></p>
</div>

<script>
let loginRole = 'admin';

const DEMO_CREDENTIALS = {
  admin: { username:'admin', password:'admin123' },
  staff: { username:'staff', password:'staff123' }
};

function selectRole(role){
  loginRole = role;
  document.querySelectorAll('.role-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.role===role));
  document.getElementById('loginRoleLabel').textContent = role==='admin' ? 'Admin' : 'Staff';
  document.getElementById('loginError').classList.remove('show');
}

function attemptLogin(){
  const user = document.getElementById('login_user').value.trim();
  const pass = document.getElementById('login_pass').value;
  const cred = DEMO_CREDENTIALS[loginRole];
  const errBox = document.getElementById('loginError');

  if(!user || !pass){
    errBox.textContent = 'Enter username and password.';
    errBox.classList.add('show');
    return;
  }

  if(user === cred.username && pass === cred.password){
    errBox.classList.remove('show');
    // Redirect to the main dashboard, passing the role + username in the URL
    const target = 'hospital-module.html?role=' + encodeURIComponent(loginRole) + '&user=' + encodeURIComponent(user);
    window.location.href = target;
  }else{
    errBox.textContent = 'Invalid username or password.';
    errBox.classList.add('show');
  }
}

document.getElementById('login_user').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
document.getElementById('login_pass').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });
</script>
</body>
</html>
