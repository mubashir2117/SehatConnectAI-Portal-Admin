<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Module — Admin + Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070D0A;
  --surface:rgba(255,255,255,0.04);
  --surface-2:rgba(255,255,255,0.07);
  --surface-3:rgba(255,255,255,0.10);
  --teal:#00D4AA;
  --teal-dark:#00B894;
  --teal-light:rgba(0,212,170,0.12);
  --teal-glow:rgba(0,212,170,0.25);
  --navy:#0D1A12;
  --navy-light:#1A2E22;
  --coral:#FF8C6B;
  --coral-light:rgba(255,140,107,0.12);
  --text:#D8E8E0;
  --text-muted:#6B8A7A;
  --border:rgba(255,255,255,0.08);
  --danger:#FF6B6B;
  --danger-light:rgba(255,107,107,0.12);
  --ok:#00D4AA;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ===== LAYOUT ===== */
#app{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{width:250px;flex-shrink:0;background:rgba(10,18,14,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:margin-left .25s ease;}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--border);background:rgba(0,212,170,0.03);}
.brand h1{font-size:18px;color:var(--teal);text-shadow:0 0 20px rgba(0,212,170,0.2);}
.brand p{margin:4px 0 0;font-size:12px;color:var(--text-muted);}

/* role switcher tabs */
.role-tabs{display:flex;padding:10px 10px 0;gap:6px;}
.role-tab{flex:1;padding:8px 0;border:none;background:var(--surface-2);border-radius:8px 8px 0 0;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:background .2s ease,color .2s ease;border-bottom:2px solid transparent;}
.role-tab.active{background:var(--surface);color:var(--teal);border-bottom-color:var(--teal);}
.role-tab:hover:not(.active){background:var(--bg);}

/* nav group animated wrapper */
.nav-group{padding:6px 10px 4px;}
.nav-group-content{overflow:hidden;transition:max-height .3s cubic-bezier(0.22,1,0.36,1),opacity .25s ease;max-height:600px;opacity:1;}
.nav-group-content.collapsed{max-height:0;opacity:0;}
.nav-group-label{display:flex;align-items:center;gap:8px;padding:4px 10px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
.nav-group-label.admin{color:var(--teal);}
.nav-group-label.staff{color:var(--coral);}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .15s,color .15s;}
.nav-item:hover{background:var(--surface-2);}
.nav-item.active{background:var(--teal-light);color:var(--teal);font-weight:500;box-shadow:inset 3px 0 0 var(--teal);}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;}
.nav-item.active .dot{background:var(--teal);box-shadow:0 0 6px var(--teal-glow);}

/* pulse ECG divider - signature element */
.pulse-divider{margin:10px 16px 4px;height:26px;}
.pulse-divider svg{width:100%;height:100%;}
.pulse-line{fill:none;stroke:rgba(255,255,255,0.08);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.pulse-glow{fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40 300;animation:pulse-run 3.2s linear infinite;opacity:.85;filter:drop-shadow(0 0 4px rgba(0,212,170,0.4));}
@keyframes pulse-run{to{stroke-dashoffset:-340;}}

/* MAIN */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{background:rgba(10,18,14,0.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
#topbar .left h2{font-size:17px;color:#fff;}
#topbar .left p{margin:2px 0 0;font-size:12px;color:var(--text-muted);}
.topbar-right{display:flex;align-items:center;gap:18px;}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);background:var(--surface-2);padding:5px 10px;border-radius:20px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:blink 1.8s ease-in-out infinite;box-shadow:0 0 6px var(--teal-glow);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.clock{font-size:12px;color:var(--text-muted);}
.bell{position:relative;font-size:18px;background:none;border:none;color:var(--text);}
.bell .badge{position:absolute;top:-4px;right:-6px;background:var(--coral);color:#fff;font-size:10px;padding:0 4px;border-radius:8px;min-width:14px;text-align:center;}
#content{padding:24px 26px 60px;overflow-y:auto;}
.view{display:none;}
.view.active{display:block;}

/* cards & grids */
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
.card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .2s;}
.card:hover{border-color:rgba(0,212,170,0.15);}
.stat-card .label{font-size:12px;color:var(--text-muted);margin-bottom:6px;}
.stat-card .value{font-size:26px;font-family:'Fraunces',serif;font-weight:600;color:#fff;}
.stat-card .sub{font-size:11.5px;color:var(--ok);margin-top:4px;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h3{font-size:15px;color:#fff;}
.section-title:first-child{margin-top:0;}

/* buttons */
.btn{border:1px solid var(--border);background:var(--surface-2);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text);transition:all .15s;}
.btn:hover{background:var(--surface-3);border-color:rgba(255,255,255,0.12);}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-dark));border-color:var(--teal);color:#fff;box-shadow:0 2px 12px rgba(0,212,170,0.25);}
.btn-primary:hover{box-shadow:0 4px 20px rgba(0,212,170,0.35);transform:translateY(-1px);}
.btn-danger{background:var(--danger-light);border-color:rgba(255,107,107,0.2);color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;}

/* table */
table{width:100%;border-collapse:collapse;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
thead th{background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);padding:10px 14px;font-weight:600;}
tbody td{padding:11px 14px;border-top:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
tbody tr{transition:background .15s;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-wrap table{border:none;}

/* badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;}
.badge.pending{background:rgba(255,200,50,0.12);color:#FFD040;}
.badge.confirmed{background:var(--teal-light);color:var(--teal);}
.badge.completed{background:rgba(255,255,255,0.06);color:var(--text-muted);}
.badge.cancelled{background:var(--danger-light);color:var(--danger);}
.badge.available{background:var(--teal-light);color:var(--teal);}
.badge.leave{background:var(--danger-light);color:var(--danger);}
.badge.busy{background:rgba(255,200,50,0.12);color:#FFD040;}

/* forms / modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.open{display:flex;}
.modal{background:rgba(15,25,20,0.97);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal h3{font-size:16px;margin-bottom:14px;color:#fff;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text);transition:border-color .2s,box-shadow .2s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,212,170,0.1);}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,0.2);}
.field textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;}
.empty i{display:block;font-size:12px;color:var(--text-muted);margin-top:4px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.toolbar input[type=search]{padding:8px 12px;border:1px solid var(--border);border-radius:8px;width:220px;background:rgba(255,255,255,0.04);color:var(--text);transition:border-color .2s;}
.toolbar input[type=search]:focus{outline:none;border-color:var(--teal);}
.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text);}
.actions-cell{display:flex;gap:6px;}

/* queue */
.queue-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.03);margin-bottom:8px;transition:border-color .2s;}
.queue-item:hover{border-color:rgba(0,212,170,0.2);}
.queue-num{width:30px;height:30px;border-radius:50%;background:var(--coral-light);color:var(--coral);font-weight:600;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;flex-shrink:0;}
.queue-item .info{flex:1;min-width:0;}
.queue-item .info .pname{font-weight:500;color:#fff;}
.queue-item .info .meta{font-size:12px;color:var(--text-muted);}
.queue-actions{display:flex;gap:6px;}

/* toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100;}
.toast{background:rgba(10,20,15,0.95);border:1px solid var(--border);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.3);backdrop-filter:blur(12px);animation:toast-in .2s ease;}
.toast.err{background:rgba(40,10,10,0.95);border-color:rgba(255,107,107,0.3);color:var(--danger);}
@keyframes toast-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* branding preview */
.brand-preview{display:flex;align-items:center;gap:14px;padding:16px;border:1px dashed var(--border);border-radius:10px;background:var(--surface-2);}
.brand-swatch{width:44px;height:44px;border-radius:10px;flex-shrink:0;}

/* analytics bars */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar-chart .bar{width:100%;background:linear-gradient(180deg,var(--teal),var(--teal-dark));border-radius:6px 6px 0 0;transition:height .4s ease;box-shadow:0 0 8px rgba(0,212,170,0.2);}
.bar-chart .bar-label{font-size:11px;color:var(--text-muted);}
.bar-chart .bar-value{font-size:11px;color:var(--text);font-weight:500;}

/* toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);}
.toggle-row:first-child{border-top:none;}
.switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--surface-3);border-radius:20px;transition:.2s;cursor:pointer;}
.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider{background:var(--teal);box-shadow:0 0 8px rgba(0,212,170,0.3);}
input:checked + .slider:before{transform:translateX(16px);}

/* sidebar footer / logout */
.sidebar-footer{margin-top:auto;padding:10px;border-top:1px solid var(--border);background:rgba(0,0,0,0.15);}
.sidebar-footer .user-info{padding:6px 12px;font-size:11px;color:var(--text-muted);margin-bottom:6px;}
.sidebar-footer .nav-item{color:var(--danger);}
.sidebar-footer .nav-item:hover{background:var(--danger-light);}
.sidebar-footer .nav-item .dot{background:var(--danger);}

.hint{font-size:12px;color:var(--text-muted);margin-top:-6px;margin-bottom:14px;}

@media(max-width:820px){
  #sidebar{position:fixed;left:0;top:0;z-index:40;margin-left:-250px;box-shadow:0 0 0 9999px rgba(0,0,0,0);}
  #sidebar.open{margin-left:0;box-shadow:0 0 40px rgba(0,0,0,.5);}
  #content{padding:18px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr;}
  #menu-btn{display:inline-flex !important;}
}
#menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;align-items:center;justify-content:center;margin-right:8px;color:var(--text);}

/* select dark style */
select{appearance:auto;}
select option{background:#0D1A12;color:var(--text);}

/* ===== ANIMATIONS ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* page content fade+slide */
@keyframes viewFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.view-enter { animation: viewFadeIn 220ms ease-out both; }

/* card stagger entrance */
@keyframes cardSlideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-stagger { animation: cardSlideUp 200ms ease-out both; }

/* card hover lift */
.card-hover {
  transition: transform 150ms ease, box-shadow 150ms ease;
  will-change: transform;
}
.card-hover:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 16px rgba(0, 212, 170, 0.08);
}

/* table row entrance */
@keyframes rowFadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.row-enter { animation: rowFadeIn 180ms ease-out both; }

/* table row collapse-out */
@keyframes rowCollapse {
  from { max-height: 60px; opacity: 1; }
  to { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; }
}
.row-exit { animation: rowCollapse 200ms ease-in forwards; overflow: hidden; }

/* badge pulse on status change */
@keyframes badgePulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.badge-pulse { animation: badgePulse 250ms ease-out; }

/* modal backdrop fade */
@keyframes backdropFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.backdrop-enter { animation: backdropFade 200ms ease-out both; }

/* modal scale in */
@keyframes modalScaleIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.modal-enter { animation: modalScaleIn 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }

/* toast slide in + out */
@keyframes toastSlideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes toastSlideOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(20px); }
}
.toast { animation: toastSlideIn 200ms ease-out both; }
.toast-exit { animation: toastSlideOut 180ms ease-in forwards; }

/* shake for form validation */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.shake { animation: shake 300ms ease-out; }

/* loading spinner */
@keyframes spin {
  to { transform: rotate(360deg); }
}
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 600ms linear infinite;
  display: inline-block;
  vertical-align: middle;
}

/* skeleton shimmer */
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--surface-2) 25%, rgba(255,255,255,0.04) 50%, var(--surface-2) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: 6px;
}

/* sidebar overlay */
@keyframes overlayFade {
  from { opacity: 0; }
  to { opacity: 1; }
}
.sidebar-overlay-enter { animation: overlayFade 200ms ease-out both; }

/* bar chart grow */
@keyframes barGrow {
  from { transform: scaleY(0); transform-origin: bottom; }
  to { transform: scaleY(1); transform-origin: bottom; }
}
.bar-grow { animation: barGrow 400ms ease-out both; }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1 id="hospitalNameDisplay">SehatConnectAI Hospital</h1>
      <p>Admin Hospital Module</p>
    </div>

    <div id="admin-nav" style="display:none;">
      <div class="nav-group">
        <div class="nav-group-content">
          <div class="nav-group-label admin">Admin Panel</div>
          <button class="nav-item active" data-view="admin-dashboard"><span class="dot"></span>Admin dashboard</button>
          <button class="nav-item" data-view="admin-profile"><span class="dot"></span>Hospital profile</button>
          <button class="nav-item" data-view="admin-branding"><span class="dot"></span>Branding</button>
          <button class="nav-item" data-view="admin-departments"><span class="dot"></span>Departments</button>
          <button class="nav-item" data-view="admin-doctors"><span class="dot"></span>Doctors</button>
          <button class="nav-item" data-view="admin-schedules"><span class="dot"></span>Schedules</button>
          <button class="nav-item" data-view="admin-availability"><span class="dot"></span>Availability</button>
          <button class="nav-item" data-view="admin-appointments"><span class="dot"></span>Appointment management</button>
          <button class="nav-item" data-view="admin-staff"><span class="dot"></span>Staff management</button>
          <button class="nav-item" data-view="admin-analytics"><span class="dot"></span>Analytics</button>
        </div>
      </div>
    </div>

    <div class="pulse-divider">
      <svg viewBox="0 0 220 26" preserveAspectRatio="none">
        <path class="pulse-line" d="M0,13 L60,13 L70,4 L80,22 L90,13 L220,13"/>
        <path class="pulse-glow" d="M0,13 L60,13 L70,4 L80,22 L90,13 L220,13"/>
      </svg>
    </div>

    <div class="nav-group" id="staff-nav" style="display:none;">
      <div class="nav-group-content">
        <div class="nav-group-label staff">Staff Panel</div>
        <button class="nav-item" data-view="staff-dashboard"><span class="dot"></span>Staff dashboard</button>
        <button class="nav-item" data-view="staff-today"><span class="dot"></span>Today's appointments</button>
        <button class="nav-item" data-view="staff-checkin"><span class="dot"></span>Patient check-in</button>
        <button class="nav-item" data-view="staff-queue"><span class="dot"></span>Queue management</button>
        <button class="nav-item" data-view="staff-availability"><span class="dot"></span>Doctor availability</button>
        <button class="nav-item" data-view="staff-profile"><span class="dot"></span>Staff profile / notifications</button>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-info" id="userDisplay"></div>
      <button class="nav-item" onclick="logout()"><span class="dot"></span>Logout</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;">
        <button id="menu-btn">☰</button>
        <div class="left">
          <h2 id="viewTitle">Admin dashboard</h2>

/* ================= STORAGE / STATE ================= */
const STORE_KEY = 'hospital-module-data';
const SHARED = true;

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function defaultData(){

    branding: { primary:'#0E6F5C', secondary:'#16324F', logoText:'SC' },
    departments: [
      { id: uid('dep'), name:'Cardiology', description:'Heart & vascular care', head:'Dr. Ayesha Khan' },
      { id: uid('dep'), name:'Orthopedics', description:'Bone & joint care', head:'Dr. Bilal Ahmed' },
      { id: uid('dep'), name:'Pediatrics', description:'Child healthcare', head:'Dr. Sana Rizvi' }

let state = null;

      { id: uid('stf'), name:'Hina Malik', role:'Nurse', departmentId:state.departments[1].id, shift:'Evening (4pm-12am)', phone:'0301-8887766' }

/* ================= UTIL ================= */
function toast(msg, isErr){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => {
    t.classList.add('toast-exit');
    t.addEventListener('animationend', () => t.remove(), { once: true });
    setTimeout(() => { if (t.parentNode) t.remove(); }, 300);
  }, 3000);
}
function fmtDate(d){ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function docName(id){ const d = state.doctors.find(x=>x.id===id); return d ? d.name : '—'; }
function depName(id){ const d = state.departments.find(x=>x.id===id); return d ? d.name : '—'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= ANIMATION UTILITIES ================= */
const anim = {
  reduced: window.matchMedia('(prefers-reduced-motion: reduce)').matches,

  fadeInUp(el, opts = {}) {
    const { delay = 0, duration = 200, offsetY = 8 } = opts;
    if (this.reduced) return;
    el.animate([
      { opacity: 0, transform: `translateY(${offsetY}px)` },
      { opacity: 1, transform: 'translateY(0)' }
    ], { duration, delay, easing: 'ease-out', fill: 'forwards' });
  },

  staggerIn(parent, selector, opts = {}) {
    const { stagger = 50, duration = 200, offsetY = 8 } = opts;
    if (this.reduced) return;
    const els = parent.querySelectorAll(selector);
    els.forEach((el, i) => {
      el.style.opacity = '0';
      el.style.willChange = 'opacity, transform';
      this.fadeInUp(el, { delay: i * stagger, duration, offsetY });
    });
  },

  scaleIn(el, opts = {}) {
    if (this.reduced) return;
    el.animate([
      { opacity: 0, transform: 'scale(0.95)' },
      { opacity: 1, transform: 'scale(1)' }
    ], { duration: opts.duration || 200, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' });
  },

  shake(el) {
    if (this.reduced) return;
    el.animate([
      { transform: 'translateX(0)' },
      { transform: 'translateX(-6px)' },
      { transform: 'translateX(6px)' },
      { transform: 'translateX(-4px)' },
      { transform: 'translateX(4px)' },
      { transform: 'translateX(0)' }
    ], { duration: 300, easing: 'ease-out' });
  },

  fadeOut(el, opts = {}) {
    if (this.reduced) return Promise.resolve();
    return el.animate([
      { opacity: 1, transform: 'scale(1)' },
      { opacity: 0, transform: 'scale(0.97)' }
    ], { duration: opts.duration || 150, easing: 'ease-in', fill: 'forwards' }).finished;
  },

  collapseOut(el, opts = {}) {
    if (this.reduced) return Promise.resolve();
    return el.animate([
      { maxHeight: el.scrollHeight + 'px', opacity: 1 },
      { maxHeight: '0px', opacity: 0 }
    ], { duration: opts.duration || 200, easing: 'ease-in', fill: 'forwards' }).finished;
  },

  countUp(el, target, opts = {}) {
    if (this.reduced) { el.textContent = target; return; }
    const duration = opts.duration || 800;
    const start = performance.now();
    const step = (now) => {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(eased * target);
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },

  slideInLeft(el, opts = {}) {
    if (this.reduced) return;
    el.animate([
      { transform: 'translateX(-100%)' },
      { transform: 'translateX(0)' }
    ], { duration: opts.duration || 250, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' });
  },

  pulse(el) {
    if (this.reduced) return;
    el.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(1.15)' },
      { transform: 'scale(1)' }
    ], { duration: 250, easing: 'ease-out' });
  }
};

async function persistAndRender(msg){
  await saveState();
  if(msg) toast(msg);
  render();
}

/* ================= SKELETON LOADING ================= */
function showSkeleton(container, count){
  count = count || 3;
  const skels = [];
  for (let i = 0; i < count; i++) {
    skels.push('<div class="card" style="margin-bottom:14px;">' +
      '<div class="skeleton" style="height:14px;width:40%;margin-bottom:10px;"></div>' +
      '<div class="skeleton" style="height:20px;width:60%;margin-bottom:8px;"></div>' +
      '<div class="skeleton" style="height:12px;width:80%;"></div></div>');
  }
  container.innerHTML = skels.join('');
}

/* ================= MODAL HELPERS ================= */
function openModal(html){
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modalBody');
  modal.innerHTML = html;
  overlay.classList.add('open');
  overlay.classList.add('backdrop-enter');
  modal.classList.add('modal-enter');
}
function closeModal(){
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modalBody');
  if (!anim.reduced) {
    modal.animate([
      { opacity: 1, transform: 'scale(1)' },
      { opacity: 0, transform: 'scale(0.95)' }
    ], { duration: 150, easing: 'ease-in', fill: 'forwards' }).finished.then(() => {
      overlay.classList.remove('open', 'backdrop-enter');
      modal.classList.remove('modal-enter');
      modal.innerHTML = '';
    });
  } else {
    overlay.classList.remove('open');
    modal.innerHTML = '';
  }
}
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id === 'overlay') closeModal();
});

/* ================= NAV ================= */
const VIEW_META = {
  'admin-dashboard':{title:'Admin dashboard', sub:'Overview of hospital operations'},
  'admin-profile':{title:'Hospital profile', sub:'Manage hospital identity and contact info'},
  'admin-branding':{title:'Branding', sub:'Set your visual identity'},
  'admin-departments':{title:'Departments', sub:'Manage hospital departments'},
  'admin-doctors':{title:'Doctors', sub:'Manage doctor profiles'},
  'admin-schedules':{title:'Schedules', sub:'Set weekly doctor schedules'},
  'admin-availability':{title:'Availability', sub:'Manage doctor availability status'},
  'admin-appointments':{title:'Appointment management', sub:'Review and manage all appointments'},
  'admin-staff':{title:'Staff management', sub:'Manage staff members and roles'},
  'admin-analytics':{title:'Analytics', sub:'Hospital performance at a glance'},
  'staff-dashboard':{title:'Staff dashboard', sub:"Today's snapshot"},
  'staff-today':{title:"Today's appointments", sub:'All appointments scheduled for today'},
  'staff-checkin':{title:'Patient check-in', sub:'Check in patients and add walk-ins'},
  'staff-queue':{title:'Queue management', sub:'Live patient queue'},
  'staff-availability':{title:'Doctor availability', sub:'Read-only view of doctor status'},
  'staff-profile':{title:'Staff profile / notifications', sub:'Your profile and recent alerts'}
};

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const view = btn.dataset.view;
    if(!view) return;
    // Staff can only access staff views
    if(currentRole === 'staff' && view.startsWith('admin-')){
      toast('Access denied. Staff cannot access admin panel.', true);
      return;
    }
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sidebar').classList.remove('open');
    render();
  });
});

/* ================= RENDER ROUTER ================= */
function render(){
  // Enforce role-based access
  if(currentRole === 'staff' && currentView.startsWith('admin-')){
    currentView = 'staff-dashboard';
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    const btn = document.querySelector('.nav-item[data-view="staff-dashboard"]');
    if(btn) btn.classList.add('active');
    toast('Access denied. Redirected to staff dashboard.', true);
  }
  const meta = VIEW_META[currentView];
  document.getElementById('viewTitle').textContent = meta.title;
  document.getElementById('viewSub').textContent = meta.sub;
  document.getElementById('hospitalNameDisplay').textContent = state.profile.name;
  document.getElementById('notifCount').textContent = state.notifications.length;

  const c = document.getElementById('content');
  const renderers = {
    'admin-dashboard': renderAdminDashboard,
    'admin-profile': renderAdminProfile,
    'admin-branding': renderAdminBranding,
    'admin-departments': renderAdminDepartments,
    'admin-doctors': renderAdminDoctors,
    'admin-schedules': renderAdminSchedules,
    'admin-availability': renderAdminAvailability,
    'admin-appointments': renderAdminAppointments,
    'admin-staff': renderAdminStaff,
    'admin-analytics': renderAdminAnalytics,
    'staff-dashboard': renderStaffDashboard,
    'staff-today': renderStaffToday,
    'staff-checkin': renderStaffCheckin,
    'staff-queue': renderStaffQueue,
    'staff-availability': renderStaffAvailability,
    'staff-profile': renderStaffProfile
  };
  c.innerHTML = renderers[currentView] ? renderers[currentView]() : '<div class="empty">View not found.</div>';

  // page transition fade+slide
  const viewEl = c.firstElementChild;
  if (viewEl) viewEl.classList.add('view-enter');

  wireDynamicHandlers();

  // stagger cards, rows, queue items + animate bars + count up numbers
  requestAnimationFrame(() => {
    const content = document.getElementById('content');
    anim.staggerIn(content, '.stat-card', { stagger: 50, duration: 200 });
    anim.staggerIn(content, '.card:not(.stat-card)', { stagger: 50, duration: 200, offsetY: 10 });
    anim.staggerIn(content, 'tbody tr', { stagger: 40, duration: 180, offsetY: 4 });
    anim.staggerIn(content, '.queue-item', { stagger: 50, duration: 200 });
    content.querySelectorAll('.bar[data-target]').forEach(bar => {
      requestAnimationFrame(() => { bar.style.height = bar.dataset.target + 'px'; });
    });
    content.querySelectorAll('.stat-card .value').forEach(el => {
      const target = parseInt(el.textContent, 10);
      if (!isNaN(target) && target > 0) anim.countUp(el, target);
    });
  });
}

/* ================= ADMIN: DASHBOARD ================= */
function renderAdminDashboard(){
  const today = todayStr();
  const todaysApts = state.appointments.filter(a=>a.date===today);
  const totalBooked = state.appointments.filter(a=>a.status==='confirmed').length;
  const totalCompleted = state.appointments.filter(a=>a.status==='completed').length;
  const totalCancelled = state.appointments.filter(a=>a.status==='cancelled').length;
  const totalPending = state.appointments.filter(a=>a.status==='pending').length;
  const activeQueue = state.queue.filter(q=>q.status!=='done').length;
  const availableDocs = state.doctors.filter(d=>d.availability==='available').length;
  return `
  <div class="grid grid-4">
    <div class="card stat-card"><div class="label">Total doctors</div><div class="value">${state.doctors.length}</div><div class="sub">${availableDocs} available now</div></div>
    <div class="card stat-card"><div class="label">Total staff</div><div class="value">${state.staff.length}</div><div class="sub">active members</div></div>
    <div class="card stat-card"><div class="label">Today's appointments</div><div class="value">${todaysApts.length}</div><div class="sub">as of now</div></div>
    <div class="card stat-card"><div class="label">Total patients</div><div class="value">${state.patients.length}</div><div class="sub">on record</div></div>
  </div>
  <div class="section-title"><h3>Appointment statistics</h3></div>
  <div class="grid grid-4">
    <div class="card stat-card"><div class="label">Booked</div><div class="value" style="color:var(--teal);">${totalBooked}</div></div>
    <div class="card stat-card"><div class="label">Completed</div><div class="value" style="color:var(--ok);">${totalCompleted}</div></div>
    <div class="card stat-card"><div class="label">Pending</div><div class="value" style="color:#FFD040;">${totalPending}</div></div>
    <div class="card stat-card"><div class="label">Cancelled</div><div class="value" style="color:var(--danger);">${totalCancelled}</div></div>
  </div>
  <div class="section-title"><h3>Live queue</h3></div>
  <div class="card"><div style="font-size:13px;color:var(--text-muted);">${activeQueue} patients in queue</div></div>
  <div class="section-title"><h3>This week's appointment load</h3></div>
  <div class="card">${weekBarChart()}</div>
  <div class="section-title"><h3>Recent appointments</h3></div>
  ${appointmentsTable(state.appointments.slice(-5).reverse(), false)}
  `;
}

function weekBarChart(){
  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-6+i);
    return d.toISOString().slice(0,10);
  });
  const counts = days.map(d=>state.appointments.filter(a=>a.date===d).length);
  const max = Math.max(1, ...counts);
  return `<div class="bar-chart">${days.map((d,i)=>`
    <div class="bar-col">
      <div class="bar-value">${counts[i]}</div>
      <div class="bar" data-target="${Math.max(6,(counts[i]/max)*120)}" style="height:6px"></div>
      <div class="bar-label">${new Date(d).toLocaleDateString('en-GB',{weekday:'short'})}</div>
    </div>`).join('')}</div>`;
}

/* ================= ADMIN: PROFILE ================= */

    <div class="field"><label>Phone</label><input id="p_phone" value="${escapeHtml(p.phone)}"></div>

  state.profile.address = document.getElementById('p_address').value.trim();

/* ================= ADMIN: DEPARTMENTS ================= */
function renderAdminDepartments(){
  const rows = state.departments.map(d=>`
    <tr>
      <td><strong>${escapeHtml(d.name)}</strong></td>
      <td>${escapeHtml(d.description||'—')}</td>
      <td>${escapeHtml(d.head||'—')}</td>
      <td>${state.doctors.filter(x=>x.departmentId===d.id).length}</td>
      <td class="actions-cell">
        <button class="btn btn-icon btn-sm" onclick="editDepartment('${d.id}')" title="Edit">✎</button>
        <button class="btn btn-icon btn-sm btn-danger" onclick="deleteDepartment('${d.id}')" title="Delete">✕</button>
      </td>
    </tr>`).join('');
  return `
  <div class="toolbar">
    <input type="search" placeholder="Search departments..." oninput="filterTable(this,'depTable')">
    <button class="btn btn-primary" onclick="editDepartment()">+ Add department</button>
  </div>
  <div class="table-wrap"><table id="depTable">
    <thead><tr><th>Name</th><th>Description</th><th>Head doctor</th><th>Doctors</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="5" class="empty">No departments yet. Add your first one.</td></tr>`}</tbody>
  </table></div>`;
}
function editDepartment(id){
  const d = id ? state.departments.find(x=>x.id===id) : {name:'',description:'',head:''};
  openModal(`
    <h3>${id?'Edit department':'Add department'}</h3>
    <div class="field"><label>Name</label><input id="m_name" value="${escapeHtml(d.name)}"></div>
    <div class="field"><label>Description</label><textarea id="m_desc">${escapeHtml(d.description)}</textarea></div>
    <div class="field"><label>Head doctor</label><input id="m_head" value="${escapeHtml(d.head)}"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveDepartment('${id||''}')">Save</button>
    </div>`);
}
async function saveDepartment(id){
  const name = document.getElementById('m_name').value.trim();
  if(!name){
    const field = document.getElementById('m_name').closest('.field');
    if (field) anim.shake(field);
    toast('Department name is required.', true); return;
  }
  const desc = document.getElementById('m_desc').value.trim();
  const head = document.getElementById('m_head').value.trim();
  const btn = document.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving...'; }
  if(id){
    const d = state.departments.find(x=>x.id===id);
    d.name=name; d.description=desc; d.head=head;
  }else{
    state.departments.push({id:uid('dep'), name, description:desc, head});
  }
  closeModal();
  await persistAndRender('Department saved');
}
async function deleteDepartment(id){
  const row = document.querySelector(`[onclick="deleteDepartment('${id}')"]`)?.closest('tr');
  if (row && !anim.reduced) await anim.collapseOut(row);
  state.departments = state.departments.filter(x=>x.id!==id);
  await persistAndRender('Department deleted');
}

/* ================= ADMIN: DOCTORS ================= */
function renderAdminDoctors(){

/* ================= STAFF: QUEUE ================= */
function renderQueueList(list, showAll){
  if(list.length===0) return `<div class="empty">Queue is empty.<i>Checked-in patients will appear here.</i></div>`;
  return list.map((q,i)=>{
    const waitMin = Math.max(0, Math.round((Date.now()-q.addedAt)/60000));
    const statusBadge = q.status==='waiting' ? 'pending' : (q.status==='in-progress' ? 'confirmed' : 'completed');
    return `
    <div class="queue-item" data-queue-id="${q.id}">
      <div class="queue-num">${i+1}</div>
      <div class="info">
        <div class="pname">${escapeHtml(q.patientName)}</div>
        <div class="meta">${escapeHtml(docName(q.doctorId))} · waiting ${waitMin} min · <span class="badge ${statusBadge}">${q.status}</span></div>
      </div>
      <div class="queue-actions">
        ${i>0 ? `<button class="btn btn-sm" onclick="moveQueue('${q.id}',-1)" title="Move up">↑</button>` : ''}
        <button class="btn btn-sm" onclick="moveQueue('${q.id}',1)" title="Move down">↓</button>
        ${q.status!=='in-progress' ? `<button class="btn btn-sm" onclick="setQueueStatus('${q.id}','in-progress')">In progress</button>` : ''}
        <button class="btn btn-sm btn-primary" onclick="setQueueStatus('${q.id}','done')">Done</button>
      </div>
    </div>`;
  }).join('');
}
function renderStaffQueue(){
  const active = state.queue.filter(q=>q.status!=='done');
  return `<div>${renderQueueList(active, true)}</div>`;
}
async function moveQueue(id, dir){
  const active = state.queue.filter(q=>q.status!=='done');
  const idx = active.findIndex(q=>q.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=active.length) return;
  const a = active[idx], b = active[swapIdx];
  const realA = state.queue.findIndex(q=>q.id===a.id);
  const realB = state.queue.findIndex(q=>q.id===b.id);
  [state.queue[realA], state.queue[realB]] = [state.queue[realB], state.queue[realA]];
  await persistAndRender();
}
async function setQueueStatus(id, status){
  const q = state.queue.find(x=>x.id===id);
  const prevStatus = q.status;
  q.status = status;
  // pulse animation on status change
  if (prevStatus !== status && !anim.reduced) {
    const el = document.querySelector(`[data-queue-id="${id}"]`);
    if (el) {
      el.style.transition = 'background-color 250ms ease, transform 250ms ease';
      el.style.transform = 'scale(1.02)';
      setTimeout(() => { el.style.transform = ''; }, 250);
    }
  }
  await persistAndRender(status==='done' ? 'Patient marked done' : 'Queue updated');
}

function filterTable(input, tableId){
  const q = input.value.toLowerCase();
  const rows = document.querySelectorAll('#'+tableId+' tbody tr');
  rows.forEach(r=>{ r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'; });
}
function wireDynamicHandlers(){
  // card hover lift
  document.querySelectorAll('.card').forEach(c => c.classList.add('card-hover'));

  // sidebar mobile drawer
  const menuBtn = document.getElementById('menu-btn');
  if (menuBtn && !menuBtn._bound) {
    menuBtn._bound = true;
    menuBtn.addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('open');
      if (sidebar.classList.contains('open')) {
        anim.slideInLeft(sidebar);
        let overlay = document.getElementById('sidebar-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'sidebar-overlay';
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:39;';
          overlay.className = 'sidebar-overlay-enter';
          overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.remove();
          });
          document.body.appendChild(overlay);
        }
      } else {
        const overlay = document.getElementById('sidebar-overlay');
        if (overlay) overlay.remove();
      }
    });
  }
}

/* ================= CLOCK ================= */
function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString('en-GB', {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}
setInterval(tickClock, 1000);

/* ================= REAL-TIME SYNC (poll storage) ================= */
async function pollSync(){
  try{
    const res = await window.storage.get(STORE_KEY, SHARED);
    if(res && res.value && res.value !== lastSnapshot){
      state = JSON.parse(res.value);
      lastSnapshot = res.value;
      render();
    }
  }catch(e){ /* silent */ }
}
setInterval(pollSync, 4000);

/* ================= BOOT ================= */
(async function boot(){
  await loadState();
  lastSnapshot = JSON.stringify(state);

  // Role-based sidebar
  const adminNav = document.getElementById('admin-nav');
  const staffNav = document.getElementById('staff-nav');
  const userDisplay = document.getElementById('userDisplay');
  if(currentRole === 'admin'){
    adminNav.style.display = '';
    staffNav.style.display = '';
    userDisplay.textContent = 'Admin: ' + currentUser;
    currentView = 'admin-dashboard';
  }else{
    adminNav.style.display = 'none';
    staffNav.style.display = '';
    userDisplay.textContent = 'Staff: ' + currentUser;
    currentView = 'staff-dashboard';
  }
  // activate correct nav item
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const activeBtn = document.querySelector(`.nav-item[data-view="${currentView}"]`);
  if(activeBtn) activeBtn.classList.add('active');

  tickClock();
  render();
})();
</script>
